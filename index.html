let S={page:'home',day:0,packing:JSON.parse(localStorage.getItem('packing')||'{}'),budget:JSON.parse(localStorage.getItem('budget')||'[]'),passport:JSON.parse(localStorage.getItem('passport')||'{"bib":"","finish":""}')};const mapUrl=n=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(n+' Bangkok')}`;const NAV_PLACES=["Fran's Sukhumvit 49", "Phed Mark", "ROAST Coffee & Eatery", "EmSphere", "Mother Cows", "Som Som Seafood", "Banthat Thong Road", "Jae Wan", "Lucky Rose Massage", "百萬魯士爺爺", "Prasat Nakhon Luang", "瑪哈泰寺 Wat Mahathat", "Pa Lek Boat Noodle", "帕席桑碧寺 Wat Phra Si Sanphet", "柴瓦塔那蘭寺 Wat Chaiwatthanaram", "Mayura's House", "Roti Saimai Mae Pom", "AETHR Rooftop Bar", "VASO - Spanish Tapas Bar", "Vault BKK", "Nana Photo Studio", "ICONSIAM", "抵達 Lucca Studio Sanctuary", "Rajadamnern Stadium", "BKK Social Club", "One Bangkok / Sindhorn Village"];const needsMap=n=>NAV_PLACES.includes(n);function nav(){return `<nav>${[['home','🏠','首頁'],['itinerary','📅','行程'],['travel','✈️','航班住宿'],['food','🍽️','美食'],['thai','🇹🇭','泰語'],['packing','🎒','行李'],['budget','💰','預算']].map(x=>`<button data-page="${x[0]}" class="${S.page===x[0]?'active':''}"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}function hero(){return `<header class="hero"><div class="heroTop"><b>🇹🇭 HYROX Bangkok Guide</b><span>Travel • Race • Recover</span></div><h1>Bangkok<br>5天4夜完賽旅行</h1><p>2026/08/12–08/16｜HYROX、大城、泰裝、美食、Recovery</p><div class="flightGrid"><div><small>Sharon & 媽媽</small><b>CI｜13:30 → 16:20</b></div><div><small>妹妹</small><b>JX745｜13:55 → 16:40</b></div></div></header>`}function home(){let diff=Math.ceil((new Date('2026-08-12T13:30:00+08:00')-new Date())/86400000);return `<main class="page active">${hero()}<section class="section"><div class="title"><h2>Dashboard</h2><span class="tag">${diff>0?'倒數 '+diff+' 天':'Travel Mode'}</span></div><div class="card"><h3>每日主題</h3>${D.itinerary.map((d,i)=>`<div class="event"><div class="time">Day ${i+1}</div><div><b>${d.date}｜${d.theme}</b><p>${d.items.slice(1,4).map(x=>x[1]).join(' → ')}</p></div></div>`).join('')}</div><div class="card passport"><h3>🏅 HYROX Passport</h3><p>不綁定個人名字，適合你、媽媽、妹妹一起使用。</p><div class="row"><input id="bib" placeholder="Bib No." value="${S.passport.bib}"><input id="finish" placeholder="Finish Time" value="${S.passport.finish}"></div></div><div class="card warn"><b>Day 1 晚餐</b><p>Fran's Sukhumvit 49｜Velvet Egg & Bacon 必吃。備案：Phed Mark 或 ROAST。</p></div></section></main>`}function itinerary(){let d=D.itinerary[S.day];return `<main class="page active"><section class="section"><div class="title"><h2>每日行程</h2><span class="tag">${d.date}</span></div><div class="tabs">${D.itinerary.map((x,i)=>`<button data-day="${i}" class="${i===S.day?'active':''}">${x.day}</button>`).join('')}</div><div class="card"><h3>${d.day}｜${d.theme}</h3>${d.items.map(x=>`<div class="event"><div class="time">${x[0]}</div><div><b>${x[1]}</b><p>${x[2]}</p>${needsMap(x[1])?`<a target="_blank" href="${mapUrl(x[1])}">📍</a>`:''}</div></div>`).join('')}</div>${S.day===2?`<div class="card warn"><h3>🚐 給 KKday 司機看</h3><p>09:00 從 Madi Paidi 接送，先到 Sindhorn Kempinski 寄放行李，再前往大城，最後送回 Sindhorn Kempinski。</p><p>พ่อแก่เงินล้าน → ปราสาทนครหลวง → วัดมหาธาตุ → ก๋วยเตี๋ยวเรือป้าเล็ก → วัดพระศรีสรรเพชญ์ → วัดไชยวัฒนาราม → เรือนมยุรา → โรตีสายไหมแม่ป้อม</p></div>`:''}</section></main>`}function travel(){return `<main class="page active"><section class="section"><div class="title"><h2>航班與住宿</h2></div>${D.flights.map(f=>`<div class="card"><h3>✈️ ${f.group}</h3><p><b>${f.airline}</b></p><p>去程：${f.outbound}</p><p>回程：${f.inbound}</p></div>`).join('')}${D.hotels.map(h=>`<div class="card"><h3>🏨 ${h.name}</h3><p>${h.stay}</p><p>早餐：${h.breakfast}</p><p>${h.address}</p><p>${h.phone}</p>${h.reservation?`<p>Reservation：${h.reservation}</p>`:''}<a target="_blank" href="${mapUrl(h.name)}">📍</a></div>`).join('')}</section></main>`}function food(){return `<main class="page active"><section class="section"><div class="title"><h2>Food Guide</h2><span class="tag">${D.food.length} places</span></div><div class="grid">${D.food.map(f=>`<div class="card food"><small>${f[1]}</small><h3>${f[0]}</h3><p>${f[2]}</p><a target="_blank" href="${mapUrl(f[0])}">📍</a></div>`).join('')}</div><div class="title"><h2>Wellness</h2></div>${D.wellness.map(w=>`<div class="card"><h3>${w[0]}</h3><p>${w[1]}</p><a target="_blank" href="${mapUrl(w[0])}">📍</a></div>`).join('')}</section></main>`}function thai(){return `<main class="page active"><section class="section"><div class="title"><h2>泰語日常空耳</h2><span class="tag">離線可用</span></div><div class="card warn"><b>使用方式</b><p>直接照空耳唸，或把泰文畫面給司機／店員看。</p></div>${Object.entries(D.thai).map(([cat,list])=>`<div class="card"><h3>${cat}</h3>${list.map(p=>`<div class="phrase"><b>${p[0]}</b><p>🇹🇭 ${p[1]}<br>🔤 ${p[2]}<br><strong>🇹🇼 ${p[3]}</strong></p></div>`).join('')}</div>`).join('')}</section></main>`}function packing(){return `<main class="page active"><section class="section"><div class="title"><h2>Packing List</h2><button class="pill" id="resetPacking">重置</button></div><div class="card">${Object.entries(D.packing).map(([cat,items])=>`<div class="cat">${cat}</div>${items.map(item=>`<label class="check"><input type="checkbox" data-pack="${item}" ${S.packing[item]?'checked':''}><span>${item}</span></label>`).join('')}`).join('')}</div></section></main>`}function budget(){let total=S.budget.reduce((s,x)=>s+Number(x.amount),0);return `<main class="page active"><section class="section"><div class="title"><h2>Budget</h2><span class="tag">${total.toLocaleString()} THB</span></div><div class="card"><div class="row"><input id="expenseName" placeholder="項目，例如 Grab"><input id="expenseAmount" type="number" placeholder="THB"></div><button class="pill primary" id="addExpense">新增花費</button></div><div class="card"><div class="budgetTotal">${total.toLocaleString()} THB</div></div>${S.budget.map(x=>`<div class="card"><b>${x.name}</b><p>${Number(x.amount).toLocaleString()} THB</p></div>`).join('')}</section></main>`}function render(){let pages={home,itinerary,travel,food,thai,packing,budget};document.getElementById('app').innerHTML=`<div class="app">${pages[S.page]()}${nav()}</div>`;bind()}function bind(){document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{S.day=Number(b.dataset.day);render()});document.querySelectorAll('[data-pack]').forEach(c=>c.onchange=()=>{S.packing[c.dataset.pack]=c.checked;localStorage.setItem('packing',JSON.stringify(S.packing))});let r=document.getElementById('resetPacking');if(r)r.onclick=()=>{S.packing={};localStorage.setItem('packing','{}');render()};let a=document.getElementById('addExpense');if(a)a.onclick=()=>{let n=document.getElementById('expenseName').value.trim(),amt=Number(document.getElementById('expenseAmount').value||0);if(!n||!amt)return;S.budget.push({name:n,amount:amt});localStorage.setItem('budget',JSON.stringify(S.budget));render()};let bib=document.getElementById('bib'),finish=document.getElementById('finish');if(bib)bib.oninput=e=>{S.passport.bib=e.target.value;localStorage.setItem('passport',JSON.stringify(S.passport))};if(finish)finish.oninput=e=>{S.passport.finish=e.target.value;localStorage.setItem('passport',JSON.stringify(S.passport))}}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));
</script></body></html>
